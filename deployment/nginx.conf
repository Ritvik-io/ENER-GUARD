# SafeScout MINE-ENERGY - Nginx Reverse Proxy Configuration
# Raspberry Pi OS Deployment (Port 80)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50M;

    # Backend API Endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Feeds (Telemetry, Controls, LiDAR)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Inspection Snapshot Images
    location /snapshots/ {
        proxy_pass http://127.0.0.1:8000/snapshots/;
        proxy_set_header Host $host;
    }

    # Frontend Static Distribution
    location / {
        root /home/pi/safescout/DASHBOARD/frontend/dist;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
}

